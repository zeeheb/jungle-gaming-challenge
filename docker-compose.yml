services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: wagering
      POSTGRES_PASSWORD: wagering
      POSTGRES_DB: wagering
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wagering -d wagering"]
      interval: 2s
      timeout: 3s
      retries: 20

  # LocalStack's community image now requires an account token, so we use
  # MiniStack (MIT, LocalStack-compatible API on the same port).
  ministack:
    image: ministackorg/ministack:1.5.35
    environment:
      AWS_DEFAULT_REGION: us-east-1
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
    ports:
      - "4566:4566"
    volumes:
      - ./docker/ministack/ready.d:/etc/localstack/init/ready.d:ro
    healthcheck:
      # the image has no curl; queues are created by the ready.d script, so
      # we only report healthy once the last one exists
      test:
        - CMD
        - python3
        - -c
        - "import sys,urllib.request;sys.exit(0 if b'wager-events.fifo' in urllib.request.urlopen('http://localhost:4566/?Action=ListQueues').read() else 1)"
      interval: 2s
      timeout: 3s
      retries: 30

  # The service itself, only with `--profile app`. Day to day, `bun run dev`
  # against the two containers above is quicker.
  migrate:
    profiles: [app]
    build: .
    image: wagering-processor:local
    command: ["bun", "scripts/migrations.ts", "up"]
    environment:
      DATABASE_URL: postgres://wagering:wagering@postgres:5432/wagering
    depends_on:
      postgres:
        condition: service_healthy

  # api + 2 workers = the "3 or more instances" of the challenge. They are the
  # same process (HTTP, consumer, outbox relay, pending-reference worker);
  # only the api publishes its port.
  api:
    profiles: [app]
    image: wagering-processor:local
    environment: &app-environment
      DATABASE_URL: postgres://wagering:wagering@postgres:5432/wagering
      SQS_ENDPOINT: http://ministack:4566
      AWS_REGION: us-east-1
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
    ports:
      - "3000:3000"
    depends_on: &app-dependencies
      migrate:
        condition: service_completed_successfully
      ministack:
        condition: service_healthy
    healthcheck: &app-healthcheck
      test: ["CMD", "bun", "-e", "const r = await fetch('http://localhost:3000/health/ready'); process.exit(r.ok ? 0 : 1)"]
      interval: 5s
      timeout: 3s
      retries: 20
    # time for in-flight messages to finish after SIGTERM
    stop_grace_period: 30s

  worker:
    profiles: [app]
    image: wagering-processor:local
    environment: *app-environment
    depends_on: *app-dependencies
    healthcheck: *app-healthcheck
    stop_grace_period: 30s
    deploy:
      replicas: 2

volumes:
  pgdata:
